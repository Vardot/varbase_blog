################################################################################
# GitLab CI for the Varbase Blog module.
#
# Two halves:
#   1. The standard Drupal CI validation jobs (composer-lint, cspell, eslint,
#      phpcs, phpstan, phpunit) provided by the drupalci templates. phpunit
#      runs the module's tests/src Unit tests on Drupal ~11.4.
#   2. A varbase-e2e BDD browser-test job (Playwright + Cucumber-js) that runs
#      the tests/features/drupal/** suite against a freshly installed Drupal
#      Standard site. The full Varbase media stack is installed with drush
#      (no PHP provisioning), and the tests/varbase_blog_test recipe creates
#      the Blog post content type, its fields, displays and the blog view, and
#      grants the create-blog permission to the Varbase roles.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# Allow the Varbase stack Composer plugins in the CI build (allow-plugins lives
# in the varbase_project template, not in modules; vardot/drupal-core-patches is
# a metapackage, not a plugin, so it is intentionally not listed here).
# Run for merge requests, branch pushes, and tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

composer:
  variables:
    # Drupal 11.4.0 released 2026-07-01; the pinned templates ref $CORE_STABLE
    # is still 11.3.
    DRUPAL_CORE: "11.4.0"
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  before_script:
    - composer config --no-plugins allow-plugins.composer/installers true || true
    - composer config --no-plugins allow-plugins.cweagans/composer-patches true || true
    - composer config --no-plugins allow-plugins.oomphinc/composer-installers-extender true || true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true || true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true || true
    - composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true || true
    - composer config --no-plugins allow-plugins.phpstan/extension-installer true || true
    - composer config --no-plugins allow-plugins.php-http/discovery true || true
    - composer config --no-plugins allow-plugins.tbachert/spi true || true
    - composer config --no-plugins allow-plugins.vardot/varbase-patches true || true
    # Pull the Varbase stack patches so the full-stack build installs on Drupal
    # 11. varbase-patches stays out of the module composer.json (project
    # concern); it is required only for the CI build.
    - composer require --no-update vardot/varbase-patches:9.2.x-dev
    # Pin the Varbase stack to its 9.2.x/10.0.x dev branches (all already require
    # Drupal ~11.4) so Composer resolves them without composer-drupal-lenient.
    - composer require --no-update drupal/varbase_core:9.2.x-dev drupal/varbase_media:9.2.x-dev drupal/varbase_seo:9.2.x-dev drupal/varbase_layout_builder:10.0.x-dev

# = Validate stage (all blocking) =
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpunit:
  allow_failure: false
  variables:
    _PHPUNIT_EXTRA: ''

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - varbase-e2e's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = varbase-e2e BDD - Drupal Standard profile + varbase_blog_test recipe =
varbase-e2e-test:
  extends: .testing-job-base
  needs: [composer]
  # Only the database service is needed. Playwright bundles its own Chromium,
  # so Selenium and chromedriver are not required.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    - !reference [.fragments, web_db]
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Varbase Blog Test" -y
    # CI-only: varbase_layout_builder 10.0.x main declares Drupal ~11.4 but its
    # submodules (vlplb, etc.) still declare ~11.3; bump them so the full stack
    # installs on Drupal 11.4. Temporary until varbase_layout_builder 10.0.x
    # ships 11.4-compatible submodules.
    - find $CI_PROJECT_DIR/$_WEB_ROOT/modules -path '*/varbase_layout_builder/*.info.yml' -exec sed -i 's/~10\.6\.0 || ~11\.3\.0/~10.6.0 || ~11.4.0/' {} +
    # Dropzone JS library for the varbase_media upload widget.
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min
    - curl -sSL https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.js -o $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min/dropzone.min.js
    - cp $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min/dropzone.min.js $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dropzone-min.js
    # Ace library for the CKEditor source editor (ace_editor) used by the blog body field.
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/libraries/ace
    - curl -sSL https://registry.npmjs.org/ace-builds/-/ace-builds-1.43.5.tgz -o /tmp/ace.tgz && tar -xzf /tmp/ace.tgz -C /tmp && cp -r /tmp/package/src-min-noconflict $CI_PROJECT_DIR/$_WEB_ROOT/libraries/ace/ && cp -r /tmp/package/src-noconflict $CI_PROJECT_DIR/$_WEB_ROOT/libraries/ace/ || true
    # Standard has no media; install it first so media.settings exists, then
    # satisfy varbase_media's icon-directory requirement.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install media media_library -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set media.settings icon_base_uri 'public://media-icons/generic' -y
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/media-icons/generic
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files || true
    # Varbase roles that the blog config grants to (create before install; plain drush, no PHP).
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create editor 'Editor' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create content_admin 'Content admin' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create site_admin 'Site admin' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:create seo_admin 'SEO admin' || true
    # Install focal_point and entity_embed first so the varbase_media install
    # does not stop on their interactive requirements, then each module in its
    # own command so a single optional-config error cannot roll back the whole set.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install focal_point -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install entity_embed embed -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_media -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_seo -y
    # varbase_blog pulls varbase_layout_builder + vlplb; a benign invalid-permission
    # ("clone script entity") notice makes drush return non-zero, so guard it,
    # then ensure the layout-builder submodules are enabled.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_blog -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT pm:install varbase_layout_builder vlplb -y || true
    # Apply the test recipe: creates the Blog post content type, its fields
    # (Body, Main media, Tags, Categories), the form/view displays and the blog
    # view, and grants the create-blog permission to the Varbase roles. The
    # `drush recipe` command is removed on Drupal 11.4; use the core `dr` script.
    - php $CI_PROJECT_DIR/vendor/bin/dr recipe $CI_PROJECT_DIR/tests/varbase_blog_test
    # Test users for the create-access matrix (plain drush, no PHP).
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create normaluser --mail="normaluser@example.test" --password="dD.123123ddd" || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create editoruser --mail="editoruser@example.test" --password="dD.123123ddd" || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add editor editoruser || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only tests/features/drupal/**. Disable varbase-e2e's auto
    # HTML hook and run generate-reports explicitly so HTML + PDF land next to
    # the JSON in tests/reports/.
    - VARBASE_E2E_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false
