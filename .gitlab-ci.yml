################################################################################
# GitLab CI for the Varbase Blog module.
#
# Two halves:
#   1. The standard Drupal CI validation jobs (composer-lint, cspell, eslint,
#      phpcs, phpstan, phpunit) provided by the drupalci templates. phpunit
#      runs the module's tests/src Kernel + Functional tests on Drupal ~11.3.
#   2. A webship-js BDD browser-test job (Playwright + Cucumber-js) that runs
#      the tests/features/drupal/** suite against a freshly installed Drupal
#      Standard site provisioned by the tests/varbase_blog_test recipe (which
#      installs Varbase Blog and grants the administration permission).
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# = Validate stage (all blocking) =
composer-lint:
  allow_failure: false
cspell:
  allow_failure: false
eslint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpunit:
  allow_failure: false
  variables:
    _PHPUNIT_EXTRA: ''

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = webship-js BDD - Drupal Standard profile + varbase_blog_test recipe =
webship-js-test:
  extends: .testing-job-base
  needs: [composer]
  # Only the database service is needed. Playwright bundles its own Chromium,
  # so Selenium and chromedriver are not required.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
  before_script:
    - !reference [.fragments, web_db]
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Varbase Blog Test" -y
    # Varbase Blog config references the Varbase roles (editor, content_admin,
    # site_admin, seo_admin) that the Standard profile does not have; create them.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval 'foreach (["editor","content_admin","site_admin","seo_admin"] as $r) { \Drupal\user\Entity\Role::create(["id" => $r, "label" => ucfirst($r)])->save(); }'
    # Dropzone JS library for the varbase_media upload widget.
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min
    - curl -sSL https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.js -o $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min/dropzone.min.js
    - cp $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dist/min/dropzone.min.js $CI_PROJECT_DIR/$_WEB_ROOT/libraries/dropzone/dropzone-min.js
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files || true
    # Install Varbase Blog via the module installer API (bypasses the interactive
    # focal_point requirements gate that aborts a non-interactive drush pm:install).
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '\Drupal::service("module_installer")->install(["varbase_blog"]);' || true
    # Force the optional config import so the Blog post content type is created.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:script $CI_PROJECT_DIR/tests/scripts/import_optional_config.php || true
    # Grant the create-blog permission to the Varbase roles and create test
    # users for the create-access permission scenarios.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:perm:add editor 'create varbase_blog content' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:perm:add content_admin 'create varbase_blog content' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT role:perm:add site_admin 'create varbase_blog content' || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '$u = \Drupal\user\Entity\User::create(["name" => "normaluser", "pass" => "dD.123123ddd", "mail" => "normaluser@example.test", "status" => 1]); $u->save(); $e = \Drupal\user\Entity\User::create(["name" => "editoruser", "pass" => "dD.123123ddd", "mail" => "editoruser@example.test", "status" => 1]); $e->addRole("editor"); $e->save();' || true
    # Varbase Blog uses Layout Builder / Bootstrap layouts, so use the Varbase
    # theme vartheme_bs4 as default (core Claro stays as the admin theme). CI/test only.
    - composer config --no-plugins allow-plugins.vardot/varbase-patches true || true
    - composer --working-dir=$CI_PROJECT_DIR require "drupal/vartheme_bs4:9.0.x-dev" --no-interaction || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT theme:install vartheme_bs4 -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.theme default vartheme_bs4 -y || true
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only tests/features/drupal/**. Disable webship-js's auto
    # HTML hook and run generate-reports explicitly so HTML + PDF land next to
    # the JSON in tests/reports/.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/cucumber_report.json
        --out  tests/reports/cucumber_report.html
        --format all
        --pdf-out tests/reports/cucumber_report.pdf
  allow_failure: false
